# SwiftLint Configuration для CounterApp
warning_threshold: 10

excluded:
  - Pods
  - CounterAppTests
  - DerivedData
  - .build

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping
  - closure_spacing
  - fatal_error_message

line_length:
  warning: 120
  error: 150
  ignores_comments: true

function_body_length:
  warning: 40
  error: 60

file_length:
  warning: 400
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length: 2
  max_length: 40
  excluded:
    - id
    - x
    - y
    - i
    - j